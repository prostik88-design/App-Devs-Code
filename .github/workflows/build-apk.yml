name: Build Devs Code APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: "Тип сборки APK"
        required: true
        default: "debug"
        type: choice
        options:
          - "debug"
          - "release"
          - "both"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 🚀 Build & Compile APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🟢 Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Setup Gradle & Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: 🔑 Configure Secrets & Environment
        run: |
          # Create .env from template or GitHub Secrets
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          elif [ -f .env.example ]; then
            cp .env.example .env
          else
            echo "GEMINI_API_KEY=" > .env
          fi

      - name: 🛠️ Grant Execute Permission for Gradle Wrapper
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          else
            gradle wrapper
            chmod +x ./gradlew
          fi

      - name: 📱 Build Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' || github.event_name == 'push' || github.event_name == 'pull_request' }}
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📦 Build Release APK
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' }}
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 🔍 Locate APK Files
        id: find_apk
        run: |
          mkdir -p outputs
          find app/build/outputs/apk/ -name "*.apk" -type f -exec cp {} outputs/ \;
          echo "Found APK files in outputs:"
          ls -lah outputs/

      - name: 📤 Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevsCode-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: warn

      - name: 📤 Upload All Generated APKs
        uses: actions/upload-artifact@v4
        with:
          name: DevsCode-All-APKs
          path: outputs/*.apk
          retention-days: 14
          if-no-files-found: ignore

      - name: 🏷️ Create GitHub Release with APK (on Tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            outputs/*.apk
          generate_release_notes: true
          name: "Devs Code ${{ github.ref_name }}"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
