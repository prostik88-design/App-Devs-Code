name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 🚀 Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🐘 Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          build-scan-publish: false

      - name: 🔑 Set up Environment
        run: |
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          elif [ -f .env.example ]; then
            cp .env.example .env
          else
            echo "GEMINI_API_KEY=" > .env
          fi

      - name: 🛠️ Setup Gradle Wrapper
        run: |
          gradle wrapper
          chmod +x ./gradlew

      - name: ℹ️ Show Gradle version
        run: ./gradlew --version

      - name: 📱 Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: 🔍 Find APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          apk_path="$(find . -type f -name '*.apk' \
            -path '*/build/outputs/apk/*' \
            -size +1k \
            | sort \
            | head -n 1)"

          if [ -z "$apk_path" ]; then
            echo "APK was not produced."
            find . -type f -path '*/build/outputs/*' -print
            exit 1
          fi

          echo "Found APK: $apk_path"
          echo "path=$apk_path" >> "$GITHUB_OUTPUT"

      - name: 📤 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: 📋 Upload Gradle logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-failure-logs
          path: |
            **/build/reports/**
            **/build/test-results/**
            ~/.gradle/daemon/**/daemon-*.out.log
          if-no-files-found: warn
          retention-days: 7
